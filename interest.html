<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102d40"><meta name="description" content="Help shape the proposed Sandy Sports Club on Minjerribah. Share the sports, facilities and community activities you would like to see.">
<title>Express interest | Sandy Sports Club proposal</title>
<link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/pages.css"><link rel="stylesheet" href="/club-system.css">
<script defer src="/site.js"></script><script defer src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"></script><script defer src="/interest.js"></script>
</head><body><div data-site-header></div><main class="club-app" id="main">
<div class="club-app-heading"><p class="eyebrow">SANDY SPORTS CLUB · PROPOSED COMMUNITY PROJECT</p>
<h1>Register interest</h1><p><strong>Want in? <a href="/member-join.html">Join free</a>.</strong> It takes a minute and you get a member area straight away.</p>
<p>Just curious? Leave your details and we'll keep you posted.</p></div>
<div id="interest-state" class="club-status" role="status">Loading…</div>
<section class="club-panel" style="max-width:780px"><form id="interest-form" hidden>
<div class="club-form-grid">
<label>First name<input name="firstName" required maxlength="80" autocomplete="given-name"></label>
<label>Email address<input type="email" name="email" required maxlength="254" autocomplete="email"></label>
<label>Town or where you are visiting from<input name="town" maxlength="100" autocomplete="address-level2"></label>
<label>Connection to Straddie<select name="audienceRegion" required><option value="local">Island local</option><option value="regional">Regional visitor</option><option value="tourist" selected>Holidaymaker / tourist</option><option value="other">Other</option></select></label>
</div>
<fieldset class="club-interest-choice"><legend>What would you like Sandy Sports to explore?</legend>
<label><input type="checkbox" name="interest" value="volleyball"> Beach volleyball</label>
<label><input type="checkbox" name="interest" value="other-sports"> Other sand sports</label>
<label><input type="checkbox" name="interest" value="wellbeing"> Health and wellbeing</label>
<label><input type="checkbox" name="interest" value="facilities"> Courts and shared facilities</label>
<label><input type="checkbox" name="interest" value="film"> Outdoor LED cinema and media</label>
<label><input type="checkbox" name="interest" value="events"> Sport and cultural events</label>
<label><input type="checkbox" name="interest" value="volunteers"> Founding or volunteering</label>
<label><input type="checkbox" name="interest" value="partners"> Potential partnerships</label>
</fieldset>
<label>Suggestions or questions<textarea name="comments" rows="4" maxlength="1800" placeholder="What do you want to see, and how might you help?"></textarea></label>
<label class="club-consent"><input type="checkbox" name="contactConsent" required> I agree that Sandy Sports' proposal organisers may retain this information and contact me about the project. I understand I am not joining a club or subscribing to marketing automatically.</label>
<div aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden"><label>Leave this empty<input name="website" tabindex="-1" autocomplete="off"></label></div>
<div id="interest-challenge" aria-label="Human verification"></div>
<button type="submit" id="interest-submit" disabled>Record expression of interest</button></form>
</section><p><a href="/member-join.html">Join free</a> · <a href="/sports.html">The sports</a></p>
</main><div data-site-footer></div></body></html>
