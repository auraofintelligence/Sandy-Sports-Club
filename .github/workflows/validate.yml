name: Validate Sandy shared club
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check server-side and browser JavaScript syntax
        run: |
          for f in worker/*.mjs studio/*.js club-view-client.js club-library-ui.js club-safeguards-ui.js club-admin.js club-login.js club-committee.js club-suite-ui.js club-workflow-assist.js club-help.js club-mozzie.js member-home.js site.js constitution.js interest.js; do node --check "$f"; done
      - name: Validate new D1 migration and zero fake club records
        run: python3 tests/schema-check.py
      - name: Run Sandy calendar and shared-club tests
        run: node --test tests/*.test.mjs
      - name: Execute Sandy D1 operational workflow integration tests
        run: node --experimental-sqlite --test tests/*.integration.mjs
      - name: Install isolated Chromium acceptance runner
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1 wrangler@4.166.0
          npx playwright install --with-deps chromium
      - name: Exercise isolated Cloudflare Worker runtime and asset manifest
        run: node tests/wrangler-release.mjs
      - name: Exercise actual clubhouse and embedded tools in a cloud browser
        run: node --experimental-sqlite tests/showcase-browser.mjs
